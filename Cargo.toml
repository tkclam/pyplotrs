[workspace]
resolver = "3"
members = ["crates/engine", "crates/python"]
exclude = ["vendor/krilla-0.8.2"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92" # krilla's floor
license = "MIT"
repository = "https://github.com/tkclam/pyplotrs"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1

# krilla with a small speed patch; see vendor/krilla-0.8.2/PYPLOTRS_PATCH.md.
[patch.crates-io]
krilla = { path = "vendor/krilla-0.8.2" }
