site_name: pyplotrs
site_description: Fast, publication-quality plotting for Python, powered by Rust.
site_url: https://tkclam.github.io/pyplotrs/
repo_url: https://github.com/tkclam/pyplotrs
repo_name: tkclam/pyplotrs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.sections, navigation.top, content.code.copy, search.suggest]

nav:
  - Home: index.md
  - Guide: guide.md
  - Gallery: gallery.md
  - API reference: api.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: sphinx
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
