# The wheel-building jobs below (linux/musllinux/windows/macos/sdist/release)
# are maturin's generated matrix:
#
#    maturin generate-ci github --pytest -o .github/workflows/CI.yml
#
# The `checks` job at the top is hand-written and is the real quality gate -
# regenerating the matrix must not drop it. Everything else only builds wheels.
name: CI

on:
  push:
    branches:
      - main
      - dev
    # Only release tags. `'*'` matched anything, so an annotation tag or a
    # `docs-v2` bookmark would run the whole wheel matrix and hand whatever
    # version happened to be in the metadata to PyPI - which, on a repository
    # sitting at 0.0.1, means tagging `v0.1.0` publishes `0.0.1` and burns both
    # names. The release job now also asserts the tag matches the metadata.
    #
    # These are GitHub filter patterns, not regexes, and GitHub validates them
    # when it loads the file: the previous second pattern ended `[ab-]*`, whose
    # trailing `-` is an unterminated range, so GitHub rejected the *whole
    # workflow* with "push event contained invalid tags patterns". Not one job
    # ran - no tests, no wheels, and no release was reachable by any tag.
    # The trailing `*` matches zero or more characters, so one pattern covers
    # both `v0.1.0` and a prerelease like `v0.1.0rc1`.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A re-tag or a quick second push otherwise races the first
# run, and two concurrent publishes to the same version is not a state PyPI
# lets you recover from. Tag runs are never cancelled: a half-finished release
# is worse than a duplicated one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Fast, single-platform correctness gate. Runs on every push and PR and is
  # what actually blocks a release; the wheel matrix only proves things compile.
  checks:
    name: tests, lint and docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

      - name: ruff
        # `ruff check` only. `ruff format --check` would rewrite 80 of 103
        # files - the mark dictionaries and the tick tables are hand-aligned to
        # be read as tables, and a formatter unwraps all of it. The lint rules
        # in pyproject.toml are chosen to catch defects instead; see the
        # comment on `[tool.ruff.lint] select`.
        run: |
          python -m pip install --upgrade pip ruff
          ruff check .

      - name: pytest
        # `pip install .` builds and installs the extension, so there is no
        # separate build step. There used to be a `maturin develop --release`
        # here, and it could never have worked: `actions/setup-python` does not
        # create a virtualenv and `.venv/` is gitignored, so maturin exited 1
        # with "Couldn't find a virtualenv or conda environment" and took the
        # whole job with it before a single test ran. It passed locally only
        # because a `.venv/` happened to exist in the working tree.
        #
        # `--strict-markers` and a non-zero collection are both deliberate: a
        # bare `pytest` over a checkout with no tests exits 5, which used to
        # look like a failure while asserting nothing.
        run: |
          # poppler-utils supplies `pdftotext`. Without it the tests that read
          # a saved PDF back and assert the label is still extractable text
          # skip themselves - and those are the ones covering the library's
          # headline promise, so the gate would be green while never checking
          # it. Cheap to install, so it is not optional here.
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python -m pip install ".[test]"
          pytest -q --strict-markers \
            --cov=pyplotrs --cov-report=term-missing --cov-fail-under=90

      - name: Source distribution builds
        # Deselected from the run above (see the `packaging` marker in
        # pyproject.toml) because it builds an sdist and resolves it with
        # cargo. It is the gate the `sdist` job below cannot be: that job
        # *builds* a tarball but never builds *from* one, so it shipped an
        # sdist whose `[patch.crates-io]` path had been left out of it.
        run: pytest -q --strict-markers -m packaging

      - name: Benchmark regression gate
        # Structural invariants (marker XObject counts, `<use>` counts, vertex
        # simplification), not wall-clock thresholds, so this does not flap on
        # a shared runner. It needs neither matplotlib nor numpy.
        run: python benchmarks/benchmark.py --check

      - name: Documentation notebooks execute
        # The notebooks under docs/notebooks/ are committed with their output
        # and rendered into the site from it (mkdocs-jupyter runs with
        # `execute: false`), so nothing else would ever run their code again.
        # This runs every cell against a real kernel and fails on the first
        # exception, without writing the results back - a rename in `Axes`
        # otherwise leaves every one of them showing code that raises, next to
        # images proving it once worked.
        run: |
          python -m pip install ".[dev]"
          python tools/build_notebooks.py --check

      - name: Build docs
        run: |
          python -m pip install ".[docs]"
          mkdocs build --strict

  # The declared MSRV has to be a fact, not an aspiration. Nothing verified it
  # before, and it was wrong by twelve minor versions.
  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - id: msrv
        run: |
          echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  linux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v7
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          uv venv .venv
          source .venv/bin/activate
          uv pip install pyplotrs --no-index --no-deps --find-links dist --reinstall
          uv pip install "pyplotrs[test]"
          pytest
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') && matrix.platform.target != 'ppc64' }}
        # v3, not v2: `distro: ubuntu24.04` only exists from v3 onward
        # (v2's Dockerfiles stop at 22.04), so on v2 every cross-arch job
        # failed to find an image - taking aarch64/armv7/s390x/ppc64le
        # with it, and with them the `release` job that needs them.
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-venv
          run: |
            set -e
            python3 -m venv .venv
            source .venv/bin/activate
            # Bare `pytest`, not `pyplotrs[test]`: numpy has no wheels for
            # armv7/s390x/ppc64le, so the extra would build it from source
            # under emulation for tens of minutes. The tests that need it skip
            # themselves individually, which is why that gate is per-test.
            pip install pytest
            pip install pyplotrs --no-index --no-deps --find-links dist --force-reinstall
            pytest

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        run: |
          set -e
          docker run --rm -v ${{ github.workspace }}:/io -w /io alpine:latest sh -c '
            apk add py3-pip py3-virtualenv
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install pyplotrs --no-index --no-deps --find-links dist --force-reinstall
            pip install "pyplotrs[test]"
            pytest
          '
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') }}
        # v3, not v2: `distro: ubuntu24.04` only exists from v3 onward
        # (v2's Dockerfiles stop at 22.04), so on v2 every cross-arch job
        # failed to find an image - taking aarch64/armv7/s390x/ppc64le
        # with it, and with them the `release` job that needs them.
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.platform.target }}
          distro: alpine_latest
          githubToken: ${{ github.token }}
          install: |
            apk add py3-virtualenv
          run: |
            set -e
            python3 -m virtualenv .venv
            source .venv/bin/activate
            # Bare `pytest`, not `pyplotrs[test]` - the same reason the linux
            # job gives, and this job needed it just as much. numpy publishes no
            # musllinux armv7 wheel, so the extra resolved to a 20 MB
            # numpy-2.5.2.tar.gz and tried to build it under emulation on an
            # Alpine image with no compiler: "Detecting compiler via `cc` ->
            # No such file or directory", and the leg failed before running a
            # single test. The tests that want numpy skip themselves one by one.
            pip install pytest
            pip install pyplotrs --no-index --no-deps --find-links dist --force-reinstall
            pytest

  windows:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v7
      - name: pytest
        shell: bash
        run: |
          set -e
          uv venv .venv
          source .venv/Scripts/activate
          uv pip install pyplotrs --no-index --no-deps --find-links dist --reinstall
          uv pip install "pyplotrs[test]"
          pytest

  macos:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - uses: astral-sh/setup-uv@v7
      - name: pytest
        run: |
          set -e
          uv venv .venv
          source .venv/bin/activate
          uv pip install pyplotrs --no-index --no-deps --find-links dist --reinstall
          uv pip install "pyplotrs[test]"
          pytest

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Tags only. `workflow_dispatch` used to reach this job, where it ran the
    # whole matrix, minted attestations for artifacts that were then thrown
    # away, and published nothing - a long, confusing no-op.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [checks, msrv, linux, musllinux, windows, macos, sdist]
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so there
    # is no long-lived API token to leak, rotate or scope. Configure the
    # publisher at https://pypi.org/manage/account/publishing/ before the first
    # release. `environment` gates the job on whatever protection rules the
    # repository puts on it (required reviewers, tag restrictions).
    environment:
      name: pypi
      url: https://pypi.org/p/pyplotrs
    permissions:
      # OIDC token for Trusted Publishing and for attestation.
      id-token: write
      # Create the GitHub Release below.
      contents: write
      # Generate the artifact attestation.
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7

      - name: The tag must match the version being published
        # Every artifact is named from the metadata version, not from the tag,
        # so a mismatch silently publishes the wrong number - and a version on
        # PyPI cannot be replaced, only yanked. Tagging `v0.1.0` on a tree
        # still saying `0.0.1` would have burned both.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          meta=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag metadata=$meta"
          if [ "$tag" != "$meta" ]; then
            echo "::error::tag v$tag does not match the package version $meta;" \
                 "bump [workspace.package].version in Cargo.toml, or retag"
            exit 1
          fi
          if ! ls wheels-*/pyplotrs-"$meta"-*.whl >/dev/null 2>&1; then
            echo "::error::no wheel named pyplotrs-$meta-*.whl among the artifacts"
            exit 1
          fi

      - name: Check the artifacts are well-formed
        run: |
          python -m pip install --upgrade twine
          twine check wheels-*/*

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        # `always`, not `automatic`: a misconfigured publisher must fail loudly
        # here rather than silently falling back to looking for a token.
        run: uv publish --trusted-publishing always 'wheels-*/*'

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" wheels-*/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [the changelog](https://tkclam.github.io/pyplotrs/about/changelog/)." \
            --verify-tag
