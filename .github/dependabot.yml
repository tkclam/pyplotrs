version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: monthly}
  - package-ecosystem: cargo
    directory: "/"
    schedule: {interval: monthly}
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: krilla  # vendored with a patch; see vendor/krilla-0.8.2
  - package-ecosystem: uv
    directory: "/"
    schedule: {interval: monthly}
