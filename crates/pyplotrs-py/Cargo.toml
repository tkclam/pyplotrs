[package]
name = "pyplotrs-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_pyplotrs_core"
crate-type = ["cdylib"]

[dependencies]
pyplotrs-core = { path = "../pyplotrs-core" }
pyplotrs-color = { path = "../pyplotrs-color" }
pyplotrs-text = { path = "../pyplotrs-text" }
pyplotrs-math = { path = "../pyplotrs-math" }
pyplotrs-layout = { path = "../pyplotrs-layout" }
pyplotrs-render-pdf = { path = "../pyplotrs-render-pdf" }
pyplotrs-render-raster = { path = "../pyplotrs-render-raster" }
pyplotrs-render-svg = { path = "../pyplotrs-render-svg" }
pyo3 = { version = "0.28", features = ["extension-module"] }
# Robust, cross-platform system-font discovery (same RazrFalcon ecosystem as
# rustybuzz/ttf-parser already in the tree). `fontconfig` honours the host's
# fontconfig directories/aliases on Unix so the Arial->Helvetica lookup finds
# whatever the OS exposes; `memmap` avoids reading every system font into RAM.
fontdb = { version = "0.23", default-features = false, features = ["fontconfig", "memmap"] }
