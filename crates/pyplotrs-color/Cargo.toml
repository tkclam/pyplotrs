[package]
name = "pyplotrs-color"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Internal to the pyplotrs workspace: these crates depend on each other by
# path, and the root patches crates.io with a vendored krilla, so a
# published copy could not resolve. `cargo publish` refuses outright.
publish = false
license.workspace = true

[dependencies]
# Color-space conversions (sRGB/linear/XYZ/Lab/Oklab/Oklch/CAM16) - a
# well-established, actively maintained crate rather than hand-rolled color
# math. Trimmed to the pieces pyplotrs actually needs: no CSS name tables
# (`named`), no RNG sampling (`random`), no serde.
palette = { version = "0.7", default-features = false, features = ["std", "approx"] }

[dev-dependencies]
approx = "0.5"

[lints]
workspace = true
