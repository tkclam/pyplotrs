[package]
name = "pyplotrs-python"
description = "Python bindings for pyplotrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyplotrs-engine = { path = "../engine" }
pyo3 = { version = "0.28", features = ["abi3-py311"] }

[lints]
workspace = true
