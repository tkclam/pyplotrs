[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pyplotrs"
dynamic = ["version"] # from Cargo.toml
description = "Fast, publication-quality plotting for Python, powered by Rust"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD-PARTY-NOTICES.md",
    "THIRD_PARTY_COLORMAPS.md",
    "crates/engine/fonts/*.txt",
    "crates/engine/fonts/NOTICE.md",
    "vendor/krilla-0.8.2/LICENSE-*",
    "vendor/krilla-0.8.2/PYPLOTRS_PATCH.md",
]
authors = [{ name = "tkclam" }]
keywords = ["plotting", "visualization", "pdf", "svg", "figures", "publication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://tkclam.github.io/pyplotrs/"
Repository = "https://github.com/tkclam/pyplotrs"
Issues = "https://github.com/tkclam/pyplotrs/issues"

[dependency-groups]
dev = [
    "maturin>=1.9",
    "pytest>=8",
    "numpy>=1.26",
    "ruff>=0.8",
    "pyright>=1.1.390",
]
bench = ["matplotlib>=3.8", "numpy>=1.26"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[tool.uv]
# Rebuild the extension when Rust sources change (`uv run` keeps it current).
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*.rs" }]
default-groups = ["dev"]

[tool.maturin]
module-name = "pyplotrs._core"
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
features = ["pyo3/extension-module"]
include = [
    { path = "crates/engine/fonts/*", format = "sdist" },
    { path = "vendor/krilla-0.8.2/**/*", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor", "site"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # the formatter owns line length; long strings may stay long
    "E741",   # single-letter names are the domain vocabulary in the math code
    "RUF001", # the minus sign U+2212 is intentional in tick labels
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["pyplotrs"]

[tool.pyright]
include = ["python/pyplotrs", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
