[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pyplotrs"
version = "0.0.1"
description = "A blazingly fast, publication-quality plotting library for Python, powered by Rust"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# Bundled fonts (Liberation Sans, STIX Two Math) ship under the SIL OFL; the
# curated colormap/palette tables are matplotlib/colorcet/cmocean/seaborn-derived
# (see THIRD_PARTY_COLORMAPS.md - colorcet's CC-BY 4.0 requires attribution).
# These travel with every wheel as required by the OFL/CC-BY.
license-files = [
    "LICENSE",
    "assets/fonts/LiberationSans-OFL.txt",
    "assets/fonts/STIXTwoMath-OFL.txt",
    "assets/fonts/NOTICE.md",
    "THIRD_PARTY_COLORMAPS.md",
]
authors = [{ name = "The pyplotrs authors" }]
keywords = [
    "plotting", "visualization", "graphics", "matplotlib", "charts",
    "pdf", "svg", "publication", "figures", "rust",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tkclam/pyplotrs"
Documentation = "https://tkclam.github.io/pyplotrs/"
Repository = "https://github.com/tkclam/pyplotrs"
Issues = "https://github.com/tkclam/pyplotrs/issues"

[project.optional-dependencies]
# Documentation build: `mkdocs build` renders the site under docs/.
# mkdocstrings renders the API pages from docstrings (mkdocs.yml declares the
# plugin, so the build aborts without it); black formats the signatures it emits.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "black>=24",
]
# Test suite: `pytest` from the repo root. The suite itself depends only on the
# standard library (it decodes PNGs with `zlib`), matching pyplotrs' own
# zero-runtime-dependency stance.
test = ["pytest>=8"]
# Benchmark-only: `benchmarks/benchmark.py` times pyplotrs head-to-head against matplotlib.
# Not a runtime dependency of pyplotrs itself. Install with `pip install -e .[bench]`.
bench = ["matplotlib>=3.8", "numpy>=1.24"]
# Interactive development: run the verify notebooks under notebooks/ with a Jupyter
# kernel (e.g. `uv pip install -e .[dev]`, then select the kernel in VS Code/Jupyter).
# matplotlib is used only as a side-by-side visual reference in the verify notebooks.
dev = ["ipykernel>=6", "matplotlib>=3.8"]

[tool.maturin]
module-name = "pyplotrs._pyplotrs_core"
manifest-path = "crates/pyplotrs-py/Cargo.toml"
python-source = "python"
# The bundled fonts are compiled into the extension via `include_bytes!`, so
# they must be present in the source distribution for a from-source build.
# The vendored MathJax bundle ships as package data (inlined into math `.html`
# output); it lives under the python-source tree so the wheel picks it up, and
# is listed here so the source distribution carries it too.
include = [
    { path = "assets/fonts/*.ttf", format = "sdist" },
    { path = "python/pyplotrs/_vendor/*.js", format = "sdist" },
]
